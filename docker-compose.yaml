services:

  client:
    extends:
      service: common
    image:     obs-headless-client
    build:
      dockerfile: docker/client.Dockerfile
      tags:
      - obs-headless-client:latest
      - obs-headless-client:${VERSION}
    volumes:
      - type:   bind
        source: ./src/client
        target: /usr/local/src/obs-headless/client/
      - type:   bind
        source: ./src/lib
        target: /usr/local/src/obs-headless/lib
  
  server:
    extends:
      service: common
    image:     obs-headless-server:latest
    build:
      dockerfile: docker/server.Dockerfile
      tags:
      - obs-headless-server:latest
      - obs-headless-server:${VERSION}
    volumes:
      - type:   bind
        source: ./src/server
        target: /usr/local/src/obs-headless/server
      - type:   bind
        source: ./src/lib
        target: /usr/local/src/obs-headless/lib
      - type:   bind
        source: ./etc/server
        target: /opt/obs-headless/etc/

  builder:
    extends:
      service: common
    image:     obs-headless-builder:latest
    build:
      dockerfile: docker/builder.Dockerfile
      tags:
      - obs-headless-builder:latest
      - obs-headless-builder:${VERSION}
      network: host
      args:
        OBS_VERSION: ${OBS_VERSION}
    volumes:
      - type:   bind
        source: ./etc/server/bashrc
        target: /root/.bashrc
      - type:   bind
        source: ${OBS_SRC_PATH_DEV}
        target: /usr/local/src/obs-studio
    stdin_open:   true
    tty:          true
    entrypoint:   /bin/bash

  base:
    extends:
      service: common
    image: obs-headless-base:latest
    build:
      context: .
      dockerfile: docker/base.Dockerfile
      tags:
      - obs-headless-base:latest
      - obs-headless-base:${VERSION}
    stdin_open:   true
    tty:          true
    entrypoint:   /bin/bash

  # This is used as a base for other GPU-dependant services to inherit from
  common:
    build:
      context: .
    network_mode: host
    privileged:   true
    security_opt:
      - seccomp:unconfined
    deploy:
      resources:
        reservations:
          devices:
            - driver:       nvidia
              count:        all
              capabilities: [gpu]
    environment:
      DISPLAY: $DISPLAY
      MODE:    normal
    volumes:
      - type:   bind
        source: ./etc/server/bashrc
        target: /root/.bashrc

  rtsp:
    image:        aler9/rtsp-simple-server
    network_mode: host
  
  sourceA:
    image:        linuxserver/ffmpeg
    network_mode: host
    command:      -stream_loop -1 -re -i video_test_sources/testsrc.mp4 -c copy -f flv rtmp://localhost/sourceA
    volumes:
      - ./etc/video_test_sources/:/video_test_sources/

  sourceB:
    image:        linuxserver/ffmpeg
    network_mode: host
    command:      -stream_loop -1 -re -i video_test_sources/testsrc2.mp4 -c copy -f flv rtmp://localhost/sourceB
    volumes:
      - ./etc/video_test_sources/:/video_test_sources/
